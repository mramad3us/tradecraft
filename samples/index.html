<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>TRADECRAFT · samples</title>
<!--
  The samples gallery. Lists samples/index.json (built by tools/gallery.mjs): every sample, every view,
  with its picture. A picture opens the view live; ★ marks a pick (kept in this browser), and
  "Copy my picks" puts the list on the clipboard, to paste back into the conversation.
-->
<style>
  :root { --bg: #121317; --card: #1b1d23; --line: #2b2e36; --text: #d9dce2; --dim: #8b909b; --pick: #e7b84f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
           padding: 14px 24px; background: rgba(18, 19, 23, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; letter-spacing: 0.14em; margin: 0; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button { font: inherit; color: var(--text); background: #262932; border: 1px solid #3a3e49; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: #5a6070; }
  main { padding: 20px 24px 60px; max-width: 1500px; margin: 0 auto; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; margin-bottom: 18px; }
  section h2 { margin: 0; font-size: 16px; font-weight: 600; }
  section h2 .id { color: var(--dim); font-weight: 400; font-size: 13px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  section p { margin: 4px 0 14px; color: var(--dim); max-width: 900px; }
  .views { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  figure { margin: 0; position: relative; }
  figure a { display: block; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #0d0e11; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; transition: transform .2s; }
  figure a:hover img { transform: scale(1.02); }
  figcaption { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 0; font-size: 13px; }
  .star { background: none; border: none; font-size: 18px; line-height: 1; padding: 2px 4px; color: #555b67; }
  .star.on { color: var(--pick); }
  figure.picked a { border-color: var(--pick); box-shadow: 0 0 0 1px var(--pick); }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #2d313b; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } .views { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>TRADECRAFT · SAMPLES</h1>
  <span class="meta" id="built"></span>
  <span class="spacer"></span>
  <span class="meta" id="count"></span>
  <button id="copy">Copy my picks</button>
  <button id="clear">Clear</button>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>
<script>
  const KEY = 'tradecraft.picks';
  const read = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch { return new Set(); } };
  const write = (s) => { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch {} };
  let picks = read();
  const toast = (t) => { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1600); };
  const count = () => { document.getElementById('count').textContent = picks.size ? `${picks.size} picked` : ''; };

  fetch('index.json', { cache: 'no-store' }).then(r => r.json()).then(({ built, samples }) => {
    document.getElementById('built').textContent = built ? `built ${built.replace('T', ' ')} UTC` : '';
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!samples.length) { list.innerHTML = '<div class="empty">No samples yet: run node tools/gallery.mjs</div>'; return; }
    for (const s of samples) {
      const sec = document.createElement('section');
      sec.innerHTML = `<h2><span class="id">${s.id.slice(0, 3)}</span>${s.title}</h2><p>${s.about}</p><div class="views"></div>`;
      const grid = sec.querySelector('.views');
      for (const v of s.views) {
        const key = `${s.id} · ${v.name}`;
        const fig = document.createElement('figure');
        fig.innerHTML = `<a href="${s.id}/${v.query ? '?' + v.query : ''}" target="_blank" rel="noopener"><img loading="lazy" src="${v.shot}?${encodeURIComponent(built || '')}" alt=""></a>
          <figcaption><span>${v.name}</span><button class="star" title="pick">★</button></figcaption>`;
        const star = fig.querySelector('.star');
        const show = () => { const on = picks.has(key); star.classList.toggle('on', on); fig.classList.toggle('picked', on); };
        star.onclick = () => { picks.has(key) ? picks.delete(key) : picks.add(key); write(picks); show(); count(); };
        fig.querySelector('img').alt = key;
        show();
        grid.appendChild(fig);
      }
      list.appendChild(sec);
    }
    count();
  }).catch(() => { document.getElementById('list').innerHTML = '<div class="empty">No samples/index.json yet: run node tools/gallery.mjs</div>'; });

  document.getElementById('copy').onclick = async () => {
    const text = picks.size ? `My picks:\n${[...picks].sort().map(p => '- ' + p).join('\n')}` : 'No picks yet.';
    try { await navigator.clipboard.writeText(text); toast('Copied: paste it in the conversation'); }
    catch { prompt('Copy this:', text); }
  };
  document.getElementById('clear').onclick = () => { picks = new Set(); write(picks); document.querySelectorAll('.star.on').forEach(b => b.click()); count(); };
</script>
</body>
</html>
